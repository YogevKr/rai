name: rai-ios
options:
  bundleIdPrefix: com.whetstone
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
packages:
  Rai:
    path: ../
schemes:
  rai-ios:
    build:
      targets:
        rai-ios: all
        rai-iosTests: [test]
    test:
      targets:
        - rai-iosTests
targets:
  rai-ios:
    type: application
    platform: iOS
    sources:
      - path: rai-ios
      - path: ../Sources/RaiApp/EndpointScrollOverlay.swift
      - path: ../Sources/RaiApp/EndpointImagesSheet.swift
      - path: ../Sources/RaiApp/EndpointPresentationSheet.swift
      - path: ../Sources/RaiApp/EndpointAppearanceMenu.swift
      - path: ../Sources/RaiApp/EndpointMetadataViews.swift
      - path: ../Sources/RaiApp/MachinePickerSheet.swift
      - path: ../Sources/RaiApp/EndpointLayoutSheet.swift
      - path: ../Sources/RaiApp/EndpointWorktreesSheet.swift
      - path: ../Sources/RaiApp/EndpointAgentLaunchSheet.swift
      - path: ../Sources/RaiApp/EndpointPluginSheet.swift
      - path: ../Sources/RaiApp/EndpointNotificationViews.swift
      - path: ../Sources/RaiApp/EndpointAgentViewRows.swift
      - path: ../Sources/RaiApp/EndpointNativeLinks.swift
      - path: ../Sources/RaiApp/EndpointTextToolsSheet.swift
      - path: ../Sources/RaiApp/EndpointClipboard.swift
    dependencies:
      - package: Rai
        product: RaiCore
      - package: Rai
        product: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whetstone.rai.ios
        PRODUCT_NAME: rai
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: T2XB37WVYD
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: rai-ios/rai-ios.entitlements
      configs:
        Debug:
          CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: NO
        Release:
          CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: NO
    entitlements:
      path: rai-ios/rai-ios.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: rai-ios/Info.plist
      properties:
        CFBundleDisplayName: Rai Remote
        CFBundleShortVersionString: "1.0"
        # Source of truth for the build number: xcodegen REGENERATES
        # Info.plist from this file, so bumping the plist alone is
        # silently reverted on the next `xcodegen generate`.
        CFBundleVersion: "38"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Scan a rai pairing code from your Mac.
        NSPhotoLibraryUsageDescription: Choose a photo or screenshot to send to an agent.
        NSLocalNetworkUsageDescription: Connect to the rai bridge running on your Mac.
        NSBonjourServices:
          - _rai._tcp
        UIBackgroundModes:
          - remote-notification
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.whetstone.rai.pair
            CFBundleURLSchemes:
              - rai
  rai-iosTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: rai-iosTests
      - path: ../Tests/RaiAppTests/EndpointThemePaletteTests.swift
      - path: ../Tests/RaiAppTests/EndpointImageRendererTests.swift
      - path: ../Tests/RaiAppTests/EndpointClipboardTests.swift
      - path: ../Tests/RaiCoreTests/EndpointGraphicsTests.swift
      - path: ../Tests/RaiCoreTests/EndpointCommandTests.swift
      - path: ../Tests/RaiCoreTests/EndpointPopupTests.swift
      - path: ../Tests/RaiCoreTests/EndpointBorderTests.swift
      - path: ../Tests/RaiCoreTests/EndpointMetadataTests.swift
      - path: ../Tests/RaiCoreTests/EndpointThemeTests.swift
      - path: ../Tests/RaiCoreTests/EndpointMouseTests.swift
      - path: ../Tests/RaiCoreTests/EndpointLayoutTests.swift
      - path: ../Tests/RaiCoreTests/WorkspaceClosePreviewTests.swift
      - path: ../Tests/RaiCoreTests/EndpointWorktreeTests.swift
      - path: ../Tests/RaiCoreTests/EndpointTextTests.swift
      - path: ../Tests/RaiCoreTests/EndpointPluginTests.swift
      - path: ../Tests/RaiCoreTests/EndpointLinkTests.swift
      - path: ../Tests/RaiCoreTests/EndpointScrollTests.swift
      - path: ../Tests/RaiCoreTests/EndpointGraphicsPolicyTests.swift
      - path: ../Tests/RaiCoreTests/MachineNotificationTests.swift
    dependencies:
      - target: rai-ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whetstone.rai.ios.tests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/rai.app/rai"
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        Debug:
          CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: NO
        Release:
          CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: NO
