name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Pin to the newest Xcode 16.x: it bundles the Metal toolchain (SwiftTerm has
      # a .metal shader) that newer Xcode ships as a separate, hard-to-use component.
      - name: Select Xcode 16
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Gate the release on the test suite — a tagged build only ships if tests pass.
      - name: Test
        run: swift test

      - name: Build universal Rai.app
        run: RAI_UNIVERSAL=1 RAI_VERSION="${{ steps.v.outputs.version }}" RAI_APP_DEST="$PWD/dist" ./scripts/bundle.sh

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Package (zip + dmg)
        working-directory: dist
        run: |
          VER="${{ steps.v.outputs.version }}"
          /usr/bin/ditto -c -k --keepParent Rai.app "Rai-${VER}-macos.zip"
          mkdir dmgsrc && cp -R Rai.app dmgsrc/
          # Styled installer window: app icon → Applications with a branded background.
          create-dmg \
            --volname "rai ${VER}" \
            --background "${GITHUB_WORKSPACE}/assets/dmg-background.png" \
            --window-pos 200 120 \
            --window-size 640 400 \
            --icon-size 128 \
            --icon "Rai.app" 168 175 \
            --app-drop-link 472 175 \
            --hide-extension "Rai.app" \
            --no-internet-enable \
            "Rai-${VER}-macos.dmg" dmgsrc \
          || {
            echo "create-dmg failed — falling back to a plain dmg"
            rm -f "Rai-${VER}-macos.dmg"
            ln -s /Applications dmgsrc/Applications
            hdiutil create -volname "rai ${VER}" -srcfolder dmgsrc -ov -format UDZO "Rai-${VER}-macos.dmg"
          }
          rm -rf dmgsrc
          ls -lh Rai-*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" \
            dist/Rai-*.dmg dist/Rai-*.zip \
            --title "rai ${{ steps.v.outputs.version }}" \
            --notes-file .github/release-notes.md

      # Keep the Homebrew cask in lockstep with the release. Needs a PAT with
      # contents:write on YogevKr/homebrew-tap, stored as the HOMEBREW_TAP_TOKEN
      # secret (the default GITHUB_TOKEN can't push to another repo). If the
      # secret is absent the step just prints the sha256 and skips, so a release
      # never fails on a missing token — you can still bump the cask by hand.
      - name: Update Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VER="${{ steps.v.outputs.version }}"
          DMG="dist/Rai-${VER}-macos.dmg"
          SHA="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          echo "Rai-${VER}-macos.dmg sha256=${SHA}"
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set — skipping cask bump. Bump manually to version ${VER}, sha256 ${SHA}."
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/YogevKr/homebrew-tap.git" tap
          cd tap
          sed -i '' -E "s/^([[:space:]]*version )\"[^\"]*\"/\1\"${VER}\"/" Casks/rai.rb
          sed -i '' -E "s/^([[:space:]]*sha256 )\"[^\"]*\"/\1\"${SHA}\"/" Casks/rai.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "cask already at ${VER} — nothing to push"
            exit 0
          fi
          git commit -am "rai ${VER}"
          git push
