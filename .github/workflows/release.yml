name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Pin to the newest Xcode 16.x: it bundles the Metal toolchain (SwiftTerm has
      # a .metal shader) that newer Xcode ships as a separate, hard-to-use component.
      - name: Select Xcode 16
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Gate the release on the test suite — a tagged build only ships if tests pass.
      - name: Test
        run: swift test

      # Import the Developer ID cert into a throwaway keychain so bundle.sh can
      # sign with it. Without the secrets the step is a no-op and the build
      # stays ad-hoc signed, exactly as it was before notarization existed.
      - name: Import Developer ID certificate
        id: signing
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          if [ -z "${CERT_P12}" ]; then
            echo "::warning::APPLE_CERT_P12 not set — ad-hoc signing, release will NOT be notarized."
            echo "identity=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          # Random per-run password: this keychain only lives for the job.
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "${CERT_P12}" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "${CERT_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Let codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity in APPLE_CERT_P12."
            exit 1
          fi
          echo "signing identity: $IDENTITY"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build universal Rai.app
        env:
          RAI_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: RAI_UNIVERSAL=1 RAI_VERSION="${{ steps.v.outputs.version }}" RAI_APP_DEST="$PWD/dist" ./scripts/bundle.sh

      # Notarize the app itself before packaging, then staple the ticket into
      # the bundle — the zip and dmg built afterwards both inherit it, so a
      # download works offline with no xattr dance.
      - name: Notarize and staple Rai.app
        if: steps.signing.outputs.identity != ''
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -z "${API_KEY_P8}" ] || [ -z "${API_KEY_ID}" ] || [ -z "${API_ISSUER_ID}" ]; then
            echo "::error::Signed with Developer ID but the notarization secrets are missing."
            exit 1
          fi
          KEY="$RUNNER_TEMP/notary.p8"
          printf '%s' "${API_KEY_P8}" | base64 --decode > "$KEY"
          # notarytool only accepts zip/dmg/pkg, so submit a throwaway zip and
          # staple the ticket onto the .app it came from.
          /usr/bin/ditto -c -k --keepParent dist/Rai.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$KEY" --key-id "${API_KEY_ID}" --issuer "${API_ISSUER_ID}" \
            --wait --timeout 30m
          xcrun stapler staple dist/Rai.app
          rm -f "$KEY" "$RUNNER_TEMP/notarize.zip"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Package (zip + dmg)
        working-directory: dist
        run: |
          VER="${{ steps.v.outputs.version }}"
          /usr/bin/ditto -c -k --keepParent Rai.app "Rai-${VER}-macos.zip"
          mkdir dmgsrc && cp -R Rai.app dmgsrc/
          # Styled installer window: app icon → Applications with a branded background.
          create-dmg \
            --volname "rai ${VER}" \
            --background "${GITHUB_WORKSPACE}/assets/dmg-background.png" \
            --window-pos 200 120 \
            --window-size 640 400 \
            --icon-size 128 \
            --icon "Rai.app" 168 175 \
            --app-drop-link 472 175 \
            --hide-extension "Rai.app" \
            --no-internet-enable \
            "Rai-${VER}-macos.dmg" dmgsrc \
          || {
            echo "create-dmg failed — falling back to a plain dmg"
            rm -f "Rai-${VER}-macos.dmg"
            ln -s /Applications dmgsrc/Applications
            hdiutil create -volname "rai ${VER}" -srcfolder dmgsrc -ov -format UDZO "Rai-${VER}-macos.dmg"
          }
          rm -rf dmgsrc
          ls -lh Rai-*

      # The app inside already carries its ticket; the disk image needs its own
      # or Gatekeeper still balks when the user opens the download.
      - name: Notarize and staple the dmg
        if: steps.signing.outputs.identity != ''
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          KEY="$RUNNER_TEMP/notary.p8"
          printf '%s' "${API_KEY_P8}" | base64 --decode > "$KEY"
          DMG="dist/Rai-${{ steps.v.outputs.version }}-macos.dmg"
          xcrun notarytool submit "$DMG" \
            --key "$KEY" --key-id "${API_KEY_ID}" --issuer "${API_ISSUER_ID}" \
            --wait --timeout 30m
          xcrun stapler staple "$DMG"
          rm -f "$KEY"
          # Prove the shipped artifacts pass the same check a user's Mac runs.
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature -vv "$DMG"
          spctl --assess --type execute -vv dist/Rai.app

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" \
            dist/Rai-*.dmg dist/Rai-*.zip \
            --title "rai ${{ steps.v.outputs.version }}" \
            --notes-file .github/release-notes.md

      # Keep the Homebrew cask in lockstep with the release. Pushes with a
      # write deploy key on YogevKr/homebrew-tap, stored as the
      # HOMEBREW_TAP_DEPLOY_KEY secret (the default GITHUB_TOKEN can't push to
      # another repo, and deploy keys never expire the way PATs do). If the
      # secret is absent the step just prints the sha256 and skips, so a release
      # never fails on a missing key — you can still bump the cask by hand.
      - name: Update Homebrew cask
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          VER="${{ steps.v.outputs.version }}"
          DMG="dist/Rai-${VER}-macos.dmg"
          SHA="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          echo "Rai-${VER}-macos.dmg sha256=${SHA}"
          if [ -z "${TAP_DEPLOY_KEY}" ]; then
            echo "::warning::HOMEBREW_TAP_DEPLOY_KEY not set — skipping cask bump. Bump manually to version ${VER}, sha256 ${SHA}."
            exit 0
          fi
          KEY="$RUNNER_TEMP/tap_deploy_key"
          printf '%s\n' "${TAP_DEPLOY_KEY}" > "$KEY"
          chmod 600 "$KEY"
          export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:YogevKr/homebrew-tap.git tap
          cd tap
          sed -i '' -E "s/^([[:space:]]*version )\"[^\"]*\"/\1\"${VER}\"/" Casks/rai.rb
          sed -i '' -E "s/^([[:space:]]*sha256 )\"[^\"]*\"/\1\"${SHA}\"/" Casks/rai.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "cask already at ${VER} — nothing to push"
            exit 0
          fi
          git commit -am "rai ${VER}"
          git push
