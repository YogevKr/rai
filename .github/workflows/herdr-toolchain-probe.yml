name: Herdr toolchain probe

# Temporary diagnosis of the PR5 Swift task-allocator abort. Remove after diagnosis.
on:
  pull_request:
    paths:
      - .github/workflows/herdr-toolchain-probe.yml

permissions:
  contents: read

concurrency:
  group: herdr-toolchain-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  probe:
    name: ${{ matrix.label }}
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base16
            source_sha: a5475786545b5bd0ae58dec9723766aa744a3313
            xcode_major: '16'
          - label: head16
            source_sha: 550090a990554769dfe77275646c80c1a99e24e3
            xcode_major: '16'
          - label: head26
            source_sha: 550090a990554769dfe77275646c80c1a99e24e3
            xcode_major: '26'
    env:
      PROBE_SHA: ${{ matrix.source_sha }}
      PROBE_XCODE_MAJOR: ${{ matrix.xcode_major }}
      PROBE_REPORT_DIR: ${{ runner.temp }}/herdr-toolchain-${{ matrix.label }}
      PROBE_SCRATCH_DIR: ${{ runner.temp }}/herdr-swift-build-${{ matrix.label }}
    steps:
      - name: Check out the exact source under test
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source_sha }}
          persist-credentials: false

      - name: Verify source and select toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROBE_REPORT_DIR"
          test "$(git rev-parse HEAD)" = "$PROBE_SHA"
          git rev-parse HEAD > "$PROBE_REPORT_DIR/source-sha.txt"
          python3 - <<'PY'
          import glob
          import os
          from pathlib import Path
          import re
          import time

          major = os.environ['PROBE_XCODE_MAJOR']
          assert major in ('16', '26')
          choices = glob.glob(f'/Applications/Xcode_{major}*.app')
          assert choices, f'No Xcode {major} installation exists on this runner'
          selected = max(choices, key=lambda p: tuple(map(int, re.findall(r'\d+', Path(p).name))))
          developer = str(Path(selected) / 'Contents/Developer')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'DEVELOPER_DIR={developer}\n')
          report = Path(os.environ['PROBE_REPORT_DIR'])
          (report / 'developer-dir.txt').write_text(developer + '\n')
          (report / 'started-at.txt').write_text(str(time.time()) + '\n')
          PY

      - name: Record compiler and runtime versions
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version | tee "$PROBE_REPORT_DIR/xcode-version.txt"
          swift --version | tee "$PROBE_REPORT_DIR/swift-version.txt"
          sw_vers | tee "$PROBE_REPORT_DIR/macos-version.txt"
          uname -m | tee "$PROBE_REPORT_DIR/architecture.txt"

      - name: Run the unchanged close regression suite
        shell: bash
        run: |
          set -euo pipefail
          swift test --jobs 4 --scratch-path "$PROBE_SCRATCH_DIR" \
            --filter CloseTabReopenTests 2>&1 | tee "$PROBE_REPORT_DIR/test.log"

      - name: Collect structural crash diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = Path(os.environ['PROBE_REPORT_DIR'])
          report.mkdir(parents=True, exist_ok=True)
          started = report / 'started-at.txt'
          since = float(started.read_text()) if started.exists() else float('inf')
          results = []
          # Exclude process arguments, environment, memory dumps, and unrelated reports.
          roots = [Path.home() / 'Library/Logs/DiagnosticReports', Path('/Library/Logs/DiagnosticReports')]
          for root in roots:
              for path in sorted(root.glob('*.ips')):
                  if path.stat().st_mtime < since:
                      continue
                  try:
                      contents = path.read_text()
                      _, offset = json.JSONDecoder().raw_decode(contents)
                      data = json.loads(contents[offset:])
                  except (OSError, ValueError) as error:
                      results.append({'file': path.name, 'parse_error': type(error).__name__})
                      continue
                  process = data.get('procName', '')
                  if process not in ('xctest', 'raiPackageTests', 'swift', 'swift-frontend'):
                      continue
                  safe = {key: data[key] for key in ('procName', 'pid', 'captureTime', 'osVersion',
                      'exception', 'termination', 'faultingThread') if key in data}
                  safe['threads'] = [{'triggered': thread.get('triggered', False),
                      'frames': [{key: frame[key] for key in ('imageIndex', 'imageOffset', 'symbol',
                          'symbolLocation') if key in frame} for frame in thread.get('frames', [])]}
                      for thread in data.get('threads', [])]
                  safe['images'] = [{key: image[key] for key in ('name', 'uuid', 'arch', 'base', 'size')
                      if key in image} for image in data.get('usedImages', [])]
                  results.append(safe)
          (report / 'crash-structure.json').write_text(json.dumps(results, indent=2) + '\n')
          print(f'Collected {len(results)} structural diagnostic records. No raw crash reports were copied.')
          PY

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: herdr-toolchain-${{ matrix.label }}-${{ github.run_id }}
          path: ${{ env.PROBE_REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 7
