name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # SwiftTerm 2.x needs swift-tools-version 6.2, so Xcode 26 or newer. Its Metal
      # shader is compiled at runtime, so the separate Metal toolchain is not needed.
      - name: Select Xcode 26
        run: |
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$XC" ] || { echo "::error::No Xcode 26 on this runner image."; exit 1; }
          sudo xcode-select -s "$XC"

      - name: Swift version
        run: swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Test bundle signing and development isolation
        run: python3 -m unittest discover -s Tests/BuildScripts -p 'test_*.py'
