name: Mint iOS certificate

# One-off: turn a locally generated CSR into an Apple Development certificate
# using the App Store Connect key that only CI holds. The private key stays on
# the machine that made the CSR; only the public certificate comes back, as an
# artifact. Combine it with the key into a p12 and store it as IOS_CERT_P12 /
# IOS_CERT_PASSWORD so release-ios.yml reuses one certificate instead of
# minting a throwaway one per run.

on:
  workflow_dispatch:
    inputs:
      csr_base64:
        description: 'Base64 of the PEM CSR (openssl req -new ... | base64)'
        required: true

permissions:
  contents: read

jobs:
  mint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Stage the App Store Connect key
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "${API_KEY_P8}" | base64 --decode \
            > "$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8"

      - name: Create the certificate
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          CSR_BASE64: ${{ github.event.inputs.csr_base64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          printf '%s' "$CSR_BASE64" | base64 --decode > "$RUNNER_TEMP/request.csr"
          swift scripts/asc-certs.swift \
            "$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8" "$API_KEY_ID" "$API_ISSUER_ID" \
            create "$RUNNER_TEMP/request.csr" "$RUNNER_TEMP/out/ios-development.cer"
          openssl x509 -inform DER -in "$RUNNER_TEMP/out/ios-development.cer" -noout -subject -serial -enddate

      - name: Upload the certificate
        uses: actions/upload-artifact@v4
        with:
          name: ios-development-cer
          path: ${{ runner.temp }}/out/ios-development.cer
          retention-days: 1

      - name: Shred the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"
