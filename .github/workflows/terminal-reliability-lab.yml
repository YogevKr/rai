name: Terminal reliability lab
on:
  push:
    branches: [fix/terminal-reliability-release]
permissions:
  contents: read
jobs:
  lab:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Test
        run: swift test
      - name: Test bundle isolation
        run: python3 -m unittest discover -s Tests/BuildScripts -p 'test_*.py'
      - name: Import Developer ID certificate
        id: signing
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          if [ -z "${CERT_P12}" ]; then
            echo "::error::APPLE_CERT_P12 is required. Refusing to release without Developer ID signing."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          # Random per-run password: this keychain only lives for the job.
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "${CERT_P12}" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "${CERT_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Let codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity in APPLE_CERT_P12."
            exit 1
          fi
          echo "signing identity: $IDENTITY"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

          # Surface the expiry while there's still time to act. Apple caps a
          # Developer ID cert at the Apple Developer Program membership end
          # date, so a short window usually means the membership is what needs
          # renewing — the cert is reissued from it.
          EXPIRY="$(security find-certificate -c 'Developer ID Application' -p "$KEYCHAIN" \
            | openssl x509 -noout -enddate | cut -d= -f2)"
          EXPIRY_EPOCH="$(date -j -f '%b %d %H:%M:%S %Y %Z' "$EXPIRY" +%s 2>/dev/null || echo 0)"
          if [ "$EXPIRY_EPOCH" -gt 0 ]; then
            DAYS=$(( (EXPIRY_EPOCH - $(date +%s)) / 86400 ))
            echo "certificate expires $EXPIRY (${DAYS} days)"
            if [ "$DAYS" -lt 0 ]; then
              echo "::error::Developer ID certificate EXPIRED on $EXPIRY. Renew the Apple Developer Program membership, issue a new cert, and update APPLE_CERT_P12/APPLE_CERT_PASSWORD."
              exit 1
            elif [ "$DAYS" -lt 45 ]; then
              echo "::warning::Developer ID certificate expires in ${DAYS} days ($EXPIRY). Renew the membership and reissue before it lapses, or releases stop notarizing."
            fi
          else
            echo "::warning::Could not parse the certificate expiry date."
          fi

      - name: Build isolated app
        env:
          RAI_BUILD_CHANNEL: lab
          RAI_LAB_ID: e2e-525bf318d69b
          RAI_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          RAI_UNIVERSAL: '1'
          RAI_VERSION: 0.1.78
        run: RAI_APP_DEST="$PWD/dist" ./scripts/bundle.sh
      - name: Notarize isolated app
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          APP="dist/Rai Lab e2e-525bf318d69b.app"
          KEY="$RUNNER_TEMP/notary.p8"
          trap 'rm -f "$KEY"' EXIT
          printf '%s' "$API_KEY_P8" | base64 --decode > "$KEY"
          /usr/bin/ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$KEY" \
            --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" --wait --timeout 20m
          xcrun stapler staple "$APP"
          codesign --verify --deep --strict "$APP"
          spctl --assess --type execute -vv "$APP"
          /usr/bin/ditto -c -k --keepParent "$APP" dist/rai-reliability-lab.zip
          git rev-parse HEAD > dist/source-commit.txt
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: rai-reliability-lab
          path: |
            dist/rai-reliability-lab.zip
            dist/source-commit.txt
          retention-days: 7
      - name: Remove job signing files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8"
